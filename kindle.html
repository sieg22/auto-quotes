var WQ = {
  zh:"https://zh.wikiquote.org/w/api.php",
  en:"https://en.wikiquote.org/w/api.php",
  jp:"https://ja.wikiquote.org/w/api.php",
  fr:"https://fr.wikiquote.org/w/api.php",
  kr:"https://ko.wikiquote.org/w/api.php"
};
var WQA = {
  zh:["\u9c81\u8fc5","\u5f20\u7231\u73b2","\u4f59\u534e","\u6e56\u5357","\u8001\u820d","\u5b54\u5b50","\u5e84\u5b50","\u674e\u767d","\u675c\u752b","\u82cf\u8f7c","\u674e\u6e05\u7167"],
  en:["Virginia Woolf","Albert Camus","Oscar Wilde","Emily Dickinson","Ernest Hemingway","Friedrich Nietzsche","Marcus Aurelius","T.S. Eliot","Walt Whitman","Dylan Thomas","Robert Frost"],
  jp:["\u592a\u5bb0\u6cbb","\u590f\u76ee\u6f31\u77f3","\u5ddd\u7aef\u5eb7\u6210","\u677e\u5c3e\u82ad\u8549","\u6b63\u5ca1\u5b50\u898f"],
  fr:["Victor Hugo","Albert Camus","Antoine de Saint-Exupery","Rene Descartes","Charles Baudelaire","Paul Verlaine"],
  kr:["\ubc15\uacbd\ub9ac","\uae40\ud6c8","\uc2e0\uacbd\uc219","\uae40\uc18c\uc6d4","\uc724\ub3d9\uc8fc","\uae40\ucd98\uc218"]
};

function xhr(url, ok, err) {
  var r = new XMLHttpRequest();
  r.open("GET", url, true);
  r.onreadystatechange = function() {
    if (r.readyState === 4) {
      if (r.status === 200) { try { ok(JSON.parse(r.responseText)); } catch(e) { err(e); } }
      else { err(new Error("HTTP " + r.status)); }
    }
  };
  r.onerror = function() { err(new Error("net")); };
  r.send();
}

function hitokoto(isLong, cb) {
  var url = "https://v1.hitokoto.cn/?c=d&c=k&c=i" + (isLong ? "&min_length=40" : "&max_length=25");
  xhr(url, function(d) {
    cb({t: d.hitokoto, a: d.from_who || "", s: d.from ? "\u300a" + d.from + "\u300b" : ""});
  }, function() { cb(null); });
}

function wq(lang, isLong, cb) {
  var api = WQ[lang];
  var authors = WQA[lang] || [];
  if (!api || !authors.length) { cb(null); return; }
  var author = authors[Math.floor(Math.random() * authors.length)];
  st((lang === "en" || lang === "fr" ? "Searching: " : "\u67e5\u8be2\uff1a") + author);
  xhr(api + "?action=query&list=search&srsearch=" + encodeURIComponent(author) + "&format=json&origin=*",
  function(sd) {
    if (!sd.query || !sd.query.search || !sd.query.search.length) { cb(null); return; }
    var pid = sd.query.search[0].pageid;
    var ptitle = sd.query.search[0].title;
    xhr(api + "?action=parse&pageid=" + pid + "&prop=sections&format=json&origin=*",
    function(secD) {
      var secs = secD.parse && secD.parse.sections ? secD.parse.sections : [];
      var v = [];
      for (var i = 0; i < secs.length; i++) { if (secs[i].toclevel <= 2) v.push(secs[i]); }
      if (!v.length) { cb(null); return; }
      var sec = v[Math.floor(Math.random() * Math.min(v.length, 4))];
      xhr(api + "?action=parse&pageid=" + pid + "&section=" + sec.index + "&prop=text&format=json&origin=*",
      function(td) {
        var html = td.parse && td.parse.text ? td.parse.text["*"] : "";
        if (!html) { cb(null); return; }
        var div = document.createElement("div");
        div.innerHTML = html;
        var items = div.querySelectorAll("li");
        var quotes = [];
        for (var j = 0; j < items.length; j++) {
          var tx = items[j].textContent.replace(/\s+/g, " ").trim();
          if (tx.length < 10 || tx.length > 1000) continue;
          if (/^(Source|See also|References|Sourced|About|External|\u6765\u6e90|\u53c2\u8003|\u51fa\u5178)/i.test(tx)) continue;
          if (lang === "zh" && !(/[\u4e00-\u9fff]/).test(tx)) continue;
          if (lang === "en") { var m = tx.match(/[a-zA-Z]/g); if (!m || m.length/tx.length < 0.5) continue; }
          if (lang === "jp" && !(/[\u3040-\u30ff]/).test(tx)) continue;
          if (lang === "kr" && !(/[\uac00-\ud7a3]/).test(tx)) continue;
          quotes.push(tx);
        }
        if (!quotes.length) { cb(null); return; }
        var pool, chosen;
        if (isLong) {
          pool = []; for (var k = 0; k < quotes.length; k++) { if (quotes[k].length > 80) pool.push(quotes[k]); }
          if (!pool.length) pool = quotes;
          chosen = pool[Math.floor(Math.random() * pool.length)];
        } else {
          pool = []; for (var n = 0; n < quotes.length; n++) { if (quotes[n].length < 80) pool.push(quotes[n]); }
          if (!pool.length) pool = quotes;
          chosen = pool[Math.floor(Math.random() * pool.length)];
          var match = chosen.match(/^[^.!?\u3002\uff01\uff1f]{5,}[.!?\u3002\uff01\uff1f]/);
          if (match) chosen = match[0].trim();
          else if (chosen.length > 65) chosen = chosen.slice(0, 60) + "\u2026";
        }
        cb({t: chosen, a: ptitle, s: ""});
      }, function() { cb(null); });
    }, function() { cb(null); });
  }, function() { cb(null); });
}

var used = {};
function pick(pool, key) {
  if (!used[key] || used[key].length >= pool.length) { used[key] = []; }
  var idx, tries = 0;
  do { idx = Math.floor(Math.random() * pool.length); tries++; }
  while (used[key].indexOf(idx) !== -1 && tries < 30);
  used[key].push(idx);
  return pool[idx];
}

function show(q) {
  var lang = document.getElementById("sl").value;
  var el = document.getElementById("qt");
  el.textContent = q.t;
  var cls = "qt f" + lang;
  if (isV) cls += " vert";
  el.className = cls;
  document.getElementById("qa").textContent = q.a ? "— " + q.a : "";
  document.getElementById("qs").textContent = (q.s && q.s !== "Wikiquote") ? q.s : "";
  st("");
}

function st(s) { document.getElementById("st").textContent = s || ""; }

function loadQuote() {
  var lang = document.getElementById("sl").value;
  var isLong = document.getElementById("sn").value === "long";
  var key = lang + "-" + (isLong ? "long" : "short");
  var pool = P[key] || [];
  document.getElementById("qt").textContent = "\u6b63\u5728\u7ffb\u9605\u4e66\u9875\u2026";
  document.getElementById("qa").textContent = "";
  document.getElementById("qs").textContent = "";
  st("");
  var useWQ = Math.random() < 0.4;
  if (useWQ) {
    wq(lang, isLong, function(q) {
      if (q) { show(q); }
      else if (pool.length) { show(pick(pool, key)); }
      else { document.getElementById("qt").textContent = "\u8bf7\u518d\u8bd5\u4e00\u6b21\u3002"; st(""); }
    });
    return;
  }
  if (lang === "zh" && Math.random() < 0.4) {
    hitokoto(isLong, function(q) {
      if (q) { show(q); } else if (pool.length) { show(pick(pool, key)); }
    });
    return;
  }
  if (pool.length) { show(pick(pool, key)); }
  else { document.getElementById("qt").textContent = "\u8bf7\u518d\u8bd5\u4e00\u6b21\u3002"; }
}

document.getElementById("bd").onclick = function() {
  isV = !isV;
  document.getElementById("bd").textContent = isV ? "\u6a2a" : "\u7ad6";
  var el = document.getElementById("qt");
  var cls = el.className;
  if (isV) { if (cls.indexOf("vert") === -1) el.className = cls + " vert"; }
  else { el.className = cls.replace(" vert", ""); }
  var at = document.getElementById("at");
  at.className = isV ? "attr va" : "attr";
};

loadQuote();
</script>
